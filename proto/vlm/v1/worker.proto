syntax = "proto3";

package vlm.v1;

message Tensor {
  repeated int64 shape = 1;
  string dtype = 2;
  bytes data = 3;
}

message RgbFrame {
  double time_sec = 1;
  int32 width = 2;
  int32 height = 3;
  bytes rgb24 = 4;
}

message RgbFrameBatch {
  repeated RgbFrame frames = 1;
}

message VisionModelInfo {
  int32 width = 1;
  int32 height = 2;
  int32 channels = 3;
  int32 image_tokens = 4;
  int32 embed_size = 5;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  int32 inflight = 2;
  float mem_available_mib = 3;
  string npu_core = 4;
  string model_id = 5;
  string service = 6;
}

message EncodeRequest {
  string job_id = 1;
  string model_id = 2;
  RgbFrameBatch frames = 3;
}

message EncodeResponse {
  string job_id = 1;
  Tensor embeddings = 2;
  repeated double frame_times = 3;
  VisionModelInfo model_info = 4;
  int32 n_image = 5;
  float encode_ms = 6;
  string error = 7;
}

message GenerateRequest {
  string job_id = 1;
  string model_id = 2;
  Tensor embeddings = 3;
  repeated double frame_times = 4;
  VisionModelInfo model_info = 5;
  int32 n_image = 6;
  string prompt = 7;
  int32 max_new_tokens = 8;
  float temperature = 9;
  bool enable_thinking = 10;
  string lang = 11;
}

message GenerateResponse {
  string job_id = 1;
  string text = 2;
  int32 max_new_tokens = 3;
  int32 generate_tokens = 4;
  bool truncated = 5;
  float generate_ms = 6;
  string error = 7;
}

message EncodeThenGenerateRequest {
  string job_id = 1;
  string model_id = 2;
  RgbFrameBatch frames = 3;
  string llm_target = 4;
  string prompt = 5;
  int32 max_new_tokens = 6;
  float temperature = 7;
  bool enable_thinking = 8;
  string lang = 9;
}

message EncodeThenGenerateResponse {
  string job_id = 1;
  string text = 2;
  int32 max_new_tokens = 3;
  int32 generate_tokens = 4;
  bool truncated = 5;
  float encode_ms = 6;
  float generate_ms = 7;
  int32 n_image = 8;
  string error = 9;
}

service VisionService {
  rpc Encode(EncodeRequest) returns (EncodeResponse);
  rpc EncodeThenGenerate(EncodeThenGenerateRequest) returns (EncodeThenGenerateResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

service LlmService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
