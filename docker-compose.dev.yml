# Dev/test container only (unit tests, no NPU, no model weights).
# Usage (local):
#   docker compose -f docker-compose.dev.yml build
#   docker compose -f docker-compose.dev.yml run --rm test
# CI builds the image via docker/build-push-action with GHA cache, then runs:
#   docker run --rm --workdir /app video-descriptor-rkllm-builder sh -c 'cmake -B build ... && ctest ...'
#
# Local runtime (API + web on RK3588): use docker-compose.yml (+ prod/prerelease overlays).

name: video-descriptor-rkllm-dev

services:
  test:
    image: video-descriptor-rkllm-builder
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: video-descriptor-rkllm-test
    working_dir: /app
    command: ["sh", "-c", "cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j\"$$(nproc)\" && ctest --test-dir /app/build --output-on-failure"]
