<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Descriptor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-index">
  <main class="container">
    <header class="page-header">
      <div>
        <h1>Video Descriptor</h1>
      </div>
      <dl id="status-dl" class="status-inline" {% if status.get('status') == 'unreachable' %}hidden{% endif %}>
        <div><dt>status</dt><dd id="st-status">{{ status.get('status', '—') }}</dd></div>
        <div><dt>job</dt><dd id="st-job" class="mono">{{ status.get('current_job_id') or '—' }}</dd></div>
        <div><dt>model</dt><dd id="st-model">{{ status.get('loaded_model_id') or '—' }}</dd></div>
      </dl>
      <p id="status-error" class="error status-error" {% if status.get('status') != 'unreachable' %}hidden{% endif %}>
        {{ status.get('error', '') }}
      </p>
    </header>

    <section class="card card-main">
      <form id="analyze-form" action="{{ url_for('analyze') }}" method="post" enctype="multipart/form-data">
        <label class="label-file">
          Видео / GIF
          <input type="file" name="video" accept="video/*,image/gif,.gif" required>
        </label>

        <div class="row row-2">
          <label>
            Модель
            <select name="model" required>
              {% set default_model_id = 'qwen3.5-2b-video' %}
              {% set has_default_model = models | selectattr('id', 'equalto', default_model_id) | list | length > 0 %}
              {% if models %}
                {% for m in models %}
                  <option value="{{ m.id }}"
                    {% if (has_default_model and m.id == default_model_id) or (not has_default_model and loop.first) %}selected{% endif %}>
                    {{ model_label(m.id) }}
                  </option>
                {% endfor %}
              {% else %}
                <option value="" disabled selected>API недоступен — нет моделей</option>
              {% endif %}
            </select>
          </label>
          <label>
            Язык
            <select name="lang">
              <option value="ru" selected>ru</option>
              <option value="eng">eng</option>
            </select>
          </label>
        </div>

        <div class="row row-2">
          <label>
            Кадры
            <input type="number" name="frames" value="16" min="1" max="128">
          </label>
          <label>
            Промпт
            <select name="prompt_mode">
              <option value="simple">Простое</option>
              <option value="detailed" selected>Подробное</option>
            </select>
          </label>
        </div>

        <details class="advanced">
          <summary>Дополнительно</summary>
          <div class="row row-3">
            <label>
              Frame budget
              <input type="number" name="frame_budget" placeholder="config" min="0" max="128">
            </label>
            <label>
              Max tokens
              <input type="number" name="max_tokens" placeholder="config" min="0" max="8192">
            </label>
            <label>
              Temperature
              <input type="number" name="temperature" placeholder="config" min="0" max="2" step="0.1">
            </label>
          </div>
          <label>
            Thinking
            <select name="enable_thinking">
              <option value="">из config</option>
              <option value="false" selected>off</option>
              <option value="true">on</option>
            </select>
          </label>
        </details>

        <button type="submit" id="analyze-submit" {% if not models %}disabled{% endif %}>Отправить</button>
      </form>

      <div id="job-progress" class="job-progress" hidden>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-label" class="progress-label muted">Подготовка…</p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const errEl = document.getElementById("status-error");
      const dl = document.getElementById("status-dl");
      const st = document.getElementById("st-status");
      const job = document.getElementById("st-job");
      const model = document.getElementById("st-model");
      const form = document.getElementById("analyze-form");
      const submitBtn = document.getElementById("analyze-submit");
      const progressBox = document.getElementById("job-progress");
      const progressFill = document.getElementById("progress-fill");
      const progressLabel = document.getElementById("progress-label");

      function dash(v) { return v && String(v).length ? v : "—"; }

      function setProgress(percent, label) {
        const p = Math.max(0, Math.min(100, Number(percent) || 0));
        progressFill.style.width = p.toFixed(1) + "%";
        progressLabel.textContent = label || "Обработка…";
      }

      async function refreshStatus() {
        try {
          const r = await fetch("/api/status", { cache: "no-store" });
          const data = await r.json();
          if (!r.ok || data.status === "unreachable") {
            errEl.textContent = data.error || "API недоступен";
            errEl.hidden = false;
            dl.hidden = true;
            return null;
          }
          errEl.hidden = true;
          dl.hidden = false;
          st.textContent = dash(data.status);
          job.textContent = dash(data.current_job_id);
          model.textContent = dash(data.loaded_model_id);
          st.classList.toggle("busy", data.status === "busy");
          return data;
        } catch (e) {
          errEl.textContent = String(e);
          errEl.hidden = false;
          dl.hidden = true;
          return null;
        }
      }

      async function pollJobProgress(knownJobId) {
        let jobId = knownJobId;
        if (!jobId) {
          const status = await refreshStatus();
          jobId = status && status.current_job_id;
        }
        if (!jobId) {
          return null;
        }
        const r = await fetch("/api/jobs/" + encodeURIComponent(jobId), { cache: "no-store" });
        if (!r.ok) {
          return jobId;
        }
        const data = await r.json();
        const pct = data.progress_percent ?? 0;
        const label = data.stage_label
          ? data.stage_label + " — " + pct.toFixed(0) + "%"
          : "Обработка — " + pct.toFixed(0) + "%";
        setProgress(pct, label);
        job.textContent = dash(data.job_id || jobId);
        st.textContent = data.status === "done" ? "idle" : "busy";
        st.classList.toggle("busy", data.status === "running");
        return jobId;
      }

      let statusTimer = null;

      function startStatusPolling() {
        refreshStatus();
        if (!statusTimer) {
          statusTimer = setInterval(refreshStatus, 2000);
        }
      }

      startStatusPolling();

      if (!form || !submitBtn) {
        return;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (submitBtn.disabled) {
          return;
        }

        submitBtn.disabled = true;
        progressBox.hidden = false;
        setProgress(0, "Загрузка файла…");

        let knownJobId = null;
        let jobPollTimer = null;

        const stopJobPoll = () => {
          if (jobPollTimer) {
            clearInterval(jobPollTimer);
            jobPollTimer = null;
          }
        };

        jobPollTimer = setInterval(async () => {
          try {
            knownJobId = await pollJobProgress(knownJobId);
          } catch (_) {
            /* ignore transient poll errors */
          }
        }, 500);

        try {
          const resp = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
          });
          stopJobPoll();
          setProgress(100, "Готово");
          const html = await resp.text();
          document.open();
          document.write(html);
          document.close();
        } catch (err) {
          stopJobPoll();
          submitBtn.disabled = false;
          progressBox.hidden = true;
          alert("Ошибка запроса: " + err);
        }
      });
    })();
  </script>
</body>
</html>
