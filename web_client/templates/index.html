<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Descriptor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-index">
  <main class="container">
    <header class="page-header">
      <div>
        <h1>Video Descriptor</h1>
      </div>
      <dl id="status-dl" class="status-inline" {% if status.get('status') == 'unreachable' %}hidden{% endif %}>
        <div><dt>status</dt><dd id="st-status">{{ status.get('status', '—') }}</dd></div>
        <div><dt>job</dt><dd id="st-job" class="mono">{{ status.get('current_job_id') or '—' }}</dd></div>
        <div><dt>model</dt><dd id="st-model">{{ status.get('loaded_model_id') or '—' }}</dd></div>
      </dl>
      <p id="status-error" class="error status-error" {% if status.get('status') != 'unreachable' %}hidden{% endif %}>
        {{ status.get('error', '') }}
      </p>
    </header>

    <section class="card card-main">
      <form id="analyze-form" action="{{ url_for('analyze') }}" method="post" enctype="multipart/form-data">
        <label class="label-file">
          Видео / GIF
          <input type="file" name="video" accept="video/*,image/gif,.gif" required>
        </label>

        <div class="row row-2">
          <label>
            Модель
            <select name="model" required>
              {% set default_model_id = 'qwen3.5-2b-video' %}
              {% set has_default_model = models | selectattr('id', 'equalto', default_model_id) | list | length > 0 %}
              {% if models %}
                {% for m in models %}
                  <option value="{{ m.id }}"
                    {% if (has_default_model and m.id == default_model_id) or (not has_default_model and loop.first) %}selected{% endif %}>
                    {{ model_label(m.id) }}
                  </option>
                {% endfor %}
              {% else %}
                <option value="" disabled selected>API недоступен — нет моделей</option>
              {% endif %}
            </select>
          </label>
          <label>
            Язык
            <select name="lang">
              <option value="ru" selected>ru</option>
              <option value="eng">eng</option>
            </select>
          </label>
        </div>

        <div class="row row-2">
          <label>
            Кадры
            <input type="number" name="frames" value="16" min="1" max="128">
          </label>
          <label>
            Промпт
            <select name="prompt_mode">
              <option value="simple">Простое</option>
              <option value="detailed" selected>Подробное</option>
            </select>
          </label>
        </div>

        <details class="advanced">
          <summary>Дополнительно</summary>
          <div class="row row-3">
            <label>
              Frame budget
              <input type="number" name="frame_budget" placeholder="config" min="0" max="128">
            </label>
            <label>
              Max tokens
              <input type="number" name="max_tokens" placeholder="config" min="0" max="8192">
            </label>
            <label>
              Temperature
              <input type="number" name="temperature" placeholder="config" min="0" max="2" step="0.1">
            </label>
          </div>
          <label>
            Thinking
            <select name="enable_thinking">
              <option value="">из config</option>
              <option value="false" selected>off</option>
              <option value="true">on</option>
            </select>
          </label>
        </details>

        <button type="submit" id="analyze-submit" {% if not models %}disabled{% endif %}>Отправить</button>
        <button type="button" id="analyze-reset" class="btn-secondary" hidden>Сбросить блокировку</button>
      </form>

      <p id="submit-warning" class="submit-warning" hidden></p>

      <div id="job-progress" class="job-progress" hidden>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-label" class="progress-label muted">Подготовка…</p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const errEl = document.getElementById("status-error");
      const dl = document.getElementById("status-dl");
      const st = document.getElementById("st-status");
      const job = document.getElementById("st-job");
      const model = document.getElementById("st-model");
      const form = document.getElementById("analyze-form");
      const submitBtn = document.getElementById("analyze-submit");
      const progressBox = document.getElementById("job-progress");
      const progressFill = document.getElementById("progress-fill");
      const progressLabel = document.getElementById("progress-label");
      const submitWarning = document.getElementById("submit-warning");
      const resetBtn = document.getElementById("analyze-reset");

      const INFLIGHT_KEY = "vlm_submit_inflight";
      const RESUME_TOKEN = {{ (resume_token or "")|tojson }};
      let submitting = false;
      let activeSubmitToken = null;

      function dash(v) { return v && String(v).length ? v : "—"; }

      function setInflight() {
        sessionStorage.setItem(INFLIGHT_KEY, String(Date.now()));
      }

      function clearInflight() {
        sessionStorage.removeItem(INFLIGHT_KEY);
      }

      function hasInflight() {
        return sessionStorage.getItem(INFLIGHT_KEY) !== null;
      }

      function showSubmitWarning(message) {
        submitWarning.textContent = message;
        submitWarning.hidden = false;
      }

      function hideSubmitWarning() {
        submitWarning.hidden = true;
        submitWarning.textContent = "";
      }

      function lockSubmit(message) {
        submitBtn.disabled = true;
        resetBtn.hidden = false;
        if (message) {
          showSubmitWarning(message);
        }
      }

      function unlockSubmit() {
        submitting = false;
        activeSubmitToken = null;
        knownJobId = null;
        progressFallbackLabel = null;
        clearInflight();
        submitBtn.disabled = false;
        resetBtn.hidden = true;
        hideSubmitWarning();
      }

      function setProgress(percent, label) {
        if (percent !== null && percent !== undefined) {
          const p = Math.max(0, Math.min(100, Number(percent) || 0));
          progressFill.style.width = p.toFixed(1) + "%";
        }
        if (label) {
          progressLabel.textContent = label;
        }
      }

      let statusTimer = null;
      let progressFallbackLabel = null;
      let knownJobId = null;

      function setProgressFallback(label) {
        progressFallbackLabel = label || null;
        if (label && !knownJobId) {
          setProgress(null, label);
        }
      }

      async function pollAnalyzeUntilDone(submitToken) {
        while (true) {
          const r = await fetch("/api/analyze/" + encodeURIComponent(submitToken), {
            cache: "no-store",
          });
          let data = {};
          try {
            data = await r.json();
          } catch (_) {
            await new Promise((resolve) => setTimeout(resolve, 1500));
            continue;
          }

          if (!r.ok && data.status === "not_found") {
            lockSubmit("Задача не найдена на веб-сервере (возможен рестарт web). Сбросьте блокировку вручную.");
            submitting = false;
            return;
          }

          if (data.status === "done") {
            clearInflight();
            window.location.assign("/result/" + encodeURIComponent(submitToken));
            return;
          }

          if (data.status === "failed" || data.status === "lost") {
            lockSubmit(data.error || "Ошибка обработки");
            submitting = false;
            return;
          }

          await new Promise((resolve) => setTimeout(resolve, 1500));
        }
      }

      async function pollJobProgress() {
        let jobId = knownJobId;
        if (!jobId) {
          const status = await refreshStatus();
          jobId = status && status.current_job_id;
        }
        if (!jobId) {
          return false;
        }

        knownJobId = jobId;
        progressFallbackLabel = null;

        const r = await fetch("/api/jobs/" + encodeURIComponent(jobId), { cache: "no-store" });
        if (!r.ok) {
          return true;
        }
        const data = await r.json();
        const pct = data.progress_percent ?? 0;
        const label = data.stage_label
          ? data.stage_label + " — " + pct.toFixed(0) + "%"
          : "Обработка — " + pct.toFixed(0) + "%";
        setProgress(pct, label);
        job.textContent = dash(data.job_id || jobId);
        st.textContent = data.status === "done" ? "idle" : "busy";
        st.classList.toggle("busy", data.status === "running");
        return true;
      }

      function startJobProgressPolling() {
        return setInterval(async () => {
          try {
            const hasJob = await pollJobProgress();
            if (!hasJob && progressFallbackLabel) {
              setProgress(null, progressFallbackLabel);
            }
          } catch (_) {
            /* ignore */
          }
        }, 1000);
      }

      async function resumeExistingJob(submitToken) {
        if (!submitToken || submitting) {
          return;
        }
        submitting = true;
        activeSubmitToken = submitToken;
        knownJobId = null;
        submitBtn.disabled = true;
        progressBox.hidden = false;
        setProgressFallback("Восстановление задачи…");
        lockSubmit("Отслеживаем уже отправленную задачу. Повторная отправка отключена.");

        const jobPollTimer = startJobProgressPolling();
        try {
          await pollAnalyzeUntilDone(submitToken);
        } finally {
          clearInterval(jobPollTimer);
        }
      }

      async function refreshStatus() {
        try {
          const r = await fetch("/api/status", { cache: "no-store" });
          const data = await r.json();
          if (!r.ok || data.status === "unreachable") {
            errEl.textContent = data.error || "API недоступен";
            errEl.hidden = false;
            dl.hidden = true;
            return null;
          }
          errEl.hidden = true;
          dl.hidden = false;
          st.textContent = dash(data.status);
          job.textContent = dash(data.current_job_id);
          model.textContent = dash(data.loaded_model_id);
          st.classList.toggle("busy", data.status === "busy");
          return data;
        } catch (e) {
          errEl.textContent = String(e);
          errEl.hidden = false;
          dl.hidden = true;
          return null;
        }
      }

      function startStatusPolling() {
        refreshStatus();
        if (!statusTimer) {
          statusTimer = setInterval(refreshStatus, 2000);
        }
      }

      startStatusPolling();

      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          if (!confirm("Сбросить блокировку? Отправляйте снова только если уверены, что API свободен.")) {
            return;
          }
          unlockSubmit();
          progressBox.hidden = true;
        });
      }

      async function recoverInflightState() {
        const token = RESUME_TOKEN || sessionStorage.getItem(INFLIGHT_KEY);
        if (!token) {
          return;
        }
        await resumeExistingJob(token);
      }

      recoverInflightState();

      if (!form || !submitBtn) {
        return;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (submitting || submitBtn.disabled || activeSubmitToken) {
          return;
        }

        const submitToken = crypto.randomUUID();
        activeSubmitToken = submitToken;
        knownJobId = null;
        submitting = true;
        sessionStorage.setItem(INFLIGHT_KEY, submitToken);
        submitBtn.disabled = true;
        resetBtn.hidden = true;
        hideSubmitWarning();
        progressBox.hidden = false;
        setProgress(0, "Загрузка файла…");

        const jobPollTimer = startJobProgressPolling();

        try {
          const body = new FormData(form);
          body.set("submit_token", submitToken);

          const resp = await fetch("/api/analyze", {
            method: "POST",
            body: body,
          });

          let data = {};
          try {
            data = await resp.json();
          } catch (_) {
            data = {};
          }

          if (resp.status === 409) {
            lockSubmit(data.error || "Уже выполняется другая задача");
            submitting = false;
            activeSubmitToken = null;
            return;
          }

          if (!resp.ok && resp.status !== 200 && resp.status !== 202) {
            lockSubmit(data.error || ("Ошибка запуска (" + resp.status + ")"));
            submitting = false;
            activeSubmitToken = null;
            return;
          }

          setProgressFallback("Файл принят, ожидание API…");
          await pollAnalyzeUntilDone(submitToken);
        } catch (err) {
          lockSubmit(
            "Связь с веб-сервером потеряна после отправки. Повтор не запускается — продолжаем отслеживание той же задачи."
          );
          try {
            await pollAnalyzeUntilDone(submitToken);
          } catch (_) {
            submitting = false;
          }
        } finally {
          clearInterval(jobPollTimer);
        }
      });
    })();
  </script>
</body>
</html>
