name: video-descriptor-rkllm

services:
  api:
    image: video-descriptor-rkllm
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-descriptor-rkllm-api
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
    environment:
      VLM_DOWNLOAD_MODELS: "${VLM_DOWNLOAD_MODELS:-0}"
      VLM_MODEL_URLS: "${VLM_MODEL_URLS:-}"
      WHISPER_RKNN_URL: "${WHISPER_RKNN_URL:-}"
      VLM_VERBOSE: "${VLM_VERBOSE:-1}"
      VLM_API_KEY: "${VLM_API_KEY:-}"
      # RK3588: pin NPU/CPU/DDR at max on start (see scripts/fix_freq_rk3588.sh). 0 = off.
      VLM_FIX_FREQ: "${VLM_FIX_FREQ:-1}"
      # 0 = do not pin Mali GPU (default: max with NPU/CPU/DDR).
      VLM_FIX_GPU_FREQ: "${VLM_FIX_GPU_FREQ:-1}"
      # Limit glibc malloc arenas (httplib is multi-threaded; default arenas retain RSS).
      MALLOC_ARENA_MAX: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  web:
    image: video-descriptor-rkllm-web
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: video-descriptor-rkllm-web
    ports:
      - "5000:5000"
    environment:
      VLM_API_URL: http://api:8080
      VLM_API_KEY: "${VLM_API_KEY:-}"
      WEB_CLIENT_DEBUG: "0"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
