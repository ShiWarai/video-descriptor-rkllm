name: Publish Docker image

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build and push to GHCR
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_API=ghcr.io/${OWNER}/video-descriptor-rkllm" >> $GITHUB_ENV
          echo "IMAGE_WEB=ghcr.io/${OWNER}/video-descriptor-rkllm-web" >> $GITHUB_ENV

      - name: Build and push API (main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_API }}:main
            ${{ env.IMAGE_API }}:${{ github.event.workflow_run.head_sha }}
          push: true
          provenance: false

      - name: Build and push web (main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_WEB }}:main
            ${{ env.IMAGE_WEB }}:${{ github.event.workflow_run.head_sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=web-main
          cache-to: type=gha,mode=max,scope=web-main
