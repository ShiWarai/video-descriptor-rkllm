name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Собрать и опубликовать prerelease-образы в GHCR (тег :prerelease)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests in Docker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and run unit tests
        run: |
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml run --rm test

  publish-prerelease:
    name: Publish prerelease images to GHCR
    needs: test
    if: |
      needs.test.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_prerelease == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))
      )
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_API=ghcr.io/${OWNER}/video-descriptor-rkllm" >> $GITHUB_ENV
          echo "IMAGE_WEB=ghcr.io/${OWNER}/video-descriptor-rkllm-web" >> $GITHUB_ENV

      - name: Build and push API (prerelease)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_API }}:prerelease
            ${{ env.IMAGE_API }}:${{ github.sha }}
          push: true
          provenance: false

      - name: Build and push web (prerelease)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_WEB }}:prerelease
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          push: true
          provenance: false
